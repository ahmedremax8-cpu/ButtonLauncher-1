name: Build Android APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Unzip project automatically
      run: |
        if [ -f "ButtonLauncher_Updated.zip" ]; then
          unzip -o ButtonLauncher_Updated.zip
        fi
        if [ -f "ButtonLauncher.zip" ]; then
          unzip -o ButtonLauncher.zip
        fi

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '7.5'

    - name: Build Debug APK
      run: |
        chmod +x gradlew || true
        gradle assembleDebug --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: ButtonLauncher-APK
        path: app/build/outputs/apk/debug/*.apk
